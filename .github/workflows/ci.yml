name: Verify
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      publish_artifact:
        description: Save the tested site for the deployment job
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --group dev
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: uv run python scripts/verify_browser_exports.py
      - name: Record tested revision
        if: inputs.publish_artifact
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/write-build-info.mjs
      - name: Save tested site for deployment
        if: inputs.publish_artifact
        uses: actions/upload-artifact@v4
        with:
          name: surge-site-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            output/
            frontend/test-results/
